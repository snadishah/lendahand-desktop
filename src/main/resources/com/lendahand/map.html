<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;}

/* ── Theme variables ─────────────────────────────────────────── */
:root {
  --bg:       #F7F6F2;
  --bg2:      #FFFFFF;
  --bg3:      #F1F5F9;
  --border:   #E8E8E8;
  --text:     #1E293B;
  --text2:    #64748B;
  --text3:    #94A3B8;
  --shadow:   rgba(0,0,0,0.08);
  --pin-open: #22C55E;
  --pin-ip:   #F59E0B;
  --pin-done: #94A3B8;
  --accent:   #FF6B6B;
  --teal:     #4ECDC4;
  --map-land: #E8EFF5;
  --map-sea:  #C8DCF0;
  --map-border:#CBD5E1;
  --map-city: #64748B;
  --map-river:#93C5FD;
  --map-grid: #E2E8F0;
}

body.dark {
  --bg:       #0f0f13;
  --bg2:      #18181f;
  --bg3:      #1e1e28;
  --border:   #2a2a35;
  --text:     #f0f0f5;
  --text2:    #6a6a80;
  --text3:    #3a3a4e;
  --shadow:   rgba(0,0,0,0.4);
  --map-land: #1a1a24;
  --map-sea:  #0d0d1a;
  --map-border:#2a2a42;
  --map-city: #3a3a5e;
  --map-river:#1e2a42;
  --map-grid: #16161e;
}

body { background:var(--bg); color:var(--text); }

/* ── Layout ─────────────────────────────────────────────────── */
#root{display:flex;width:100%;height:100%;}
#map-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);}
#map-svg{width:100%;height:100%;display:block;transition:background .3s;}

/* ── Panel ──────────────────────────────────────────────────── */
#panel{
  width:272px;flex-shrink:0;background:var(--bg2);
  border-left:2px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  transition:background .3s, border-color .3s;
}
#ph{padding:16px 18px 12px;border-bottom:2px solid var(--border);}
#ph h3{font-size:14px;font-weight:800;color:var(--text);margin-bottom:2px;}
#ph p{font-size:10px;color:var(--text3);}

/* Stats */
#stats{display:flex;gap:7px;padding:10px 16px;border-bottom:2px solid var(--border);}
.sb{flex:1;background:var(--bg3);border:1.5px solid var(--border);
    border-radius:10px;padding:9px 7px;text-align:center;transition:background .3s;}
.sn{font-size:17px;font-weight:800;color:#FF6B6B;line-height:1;}
.sl{font-size:8px;color:var(--text3);font-weight:700;text-transform:uppercase;
    letter-spacing:.6px;margin-top:2px;}

/* Filters */
#filters{display:flex;gap:5px;padding:8px 16px;border-bottom:2px solid var(--border);}
.fb{flex:1;padding:6px 0;border:1.5px solid var(--border);border-radius:8px;
    background:transparent;color:var(--text3);font-size:9px;font-weight:700;
    cursor:pointer;text-transform:uppercase;letter-spacing:.5px;transition:all .15s;}
.fb.on{background:#FF6B6B;border-color:#FF6B6B;color:#fff;}
.fb:hover:not(.on){border-color:var(--text2);color:var(--text2);}

/* Task list */
#tlist{flex:1;overflow-y:auto;padding:7px 10px;}
#tlist::-webkit-scrollbar{width:3px;}
#tlist::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

.tc{background:var(--bg3);border:1.5px solid var(--border);
    border-radius:12px;padding:11px 13px;margin-bottom:7px;
    cursor:pointer;transition:all .15s;}
.tc:hover{border-color:#FF6B6B44;background:var(--bg2);}
.tc.sel{border-color:#FF6B6B;background:var(--bg2);}
.tc-cat{font-size:8px;font-weight:800;color:#FF6B6B;text-transform:uppercase;
        letter-spacing:.7px;margin-bottom:2px;}
.tc-title{font-size:12px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:4px;}
.tc-price{font-size:13px;font-weight:800;color:#FF6B6B;margin-bottom:3px;}
.tc-meta{font-size:9px;color:var(--text3);margin-bottom:2px;}
.tc-dist{font-size:9px;color:#4ECDC4;font-weight:700;margin-top:3px;}
.b-open{display:inline-block;background:#DCFCE7;color:#16A34A;
  border:1px solid #BBF7D0;border-radius:20px;
  padding:1px 8px;font-size:8px;font-weight:800;margin-top:3px;}
.b-ip{display:inline-block;background:#FEF3C7;color:#D97706;
  border:1px solid #FDE68A;border-radius:20px;
  padding:1px 8px;font-size:8px;font-weight:800;margin-top:3px;}

/* View button */
#vbtn{display:none;margin:0 10px 10px;padding:11px 0;
  background:linear-gradient(135deg,#FF6B6B,#FF8E53);
  color:#fff;border:none;border-radius:12px;font-size:13px;
  font-weight:800;cursor:pointer;transition:filter .15s;}
#vbtn:hover{filter:brightness(1.08);}

/* Theme toggle button */
#themeBtn{
  margin:6px 10px 0;padding:8px 0;
  background:var(--bg3);color:var(--text2);
  border:1.5px solid var(--border);border-radius:10px;
  font-size:11px;font-weight:700;cursor:pointer;
  transition:all .15s;
}
#themeBtn:hover{border-color:#FF6B6B;color:#FF6B6B;}

/* Tooltip */
#tip{position:absolute;pointer-events:none;
  background:var(--bg2);border:2px solid #FF6B6B44;
  border-radius:14px;padding:13px 15px;
  min-width:220px;max-width:260px;
  box-shadow:0 12px 40px var(--shadow);
  display:none;z-index:50;transition:background .3s;}
.t-cat{font-size:8px;font-weight:800;color:#FF6B6B;
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px;}
.t-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3;}
.t-price{font-size:15px;font-weight:800;color:#FF6B6B;margin-bottom:3px;}
.t-addr{font-size:10px;color:var(--text3);margin-bottom:2px;}
.t-dist{font-size:10px;color:#4ECDC4;font-weight:700;margin-top:3px;}

/* Legend */
#leg{position:absolute;bottom:14px;left:14px;z-index:20;
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:10px;padding:10px 14px;
  box-shadow:0 4px 16px var(--shadow);transition:background .3s;}
.li{display:flex;align-items:center;gap:7px;
    font-size:10px;color:var(--text2);margin:3px 0;}
.ld{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* Zoom */
#zctrl{position:absolute;bottom:14px;right:14px;z-index:20;
       display:flex;flex-direction:column;gap:3px;}
.zb{width:32px;height:32px;background:var(--bg2);
    border:1.5px solid var(--border);border-radius:8px;
    color:var(--text2);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;}
.zb:hover{border-color:#FF6B6B;color:#FF6B6B;}
</style>
</head>
<body>
<div id="root">

<!-- MAP AREA -->
<div id="map-wrap">
<svg id="map-svg" viewBox="0 0 760 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bgr" cx="45%" cy="45%">

      <feGaussianBlur stdDeviation="3" result="blur"/>

<div id="tip">
  <div class="t-cat"   id="t-cat"></div>
  <div class="t-title" id="t-title"></div>
  <div class="t-price" id="t-price"></div>
  <div class="t-addr"  id="t-addr"></div>

</div>

<div id="leg">
  <div class="li"><span class="ld" style="background:#22C55E"></span>Open Task</div>
  <div class="li"><span class="ld" style="background:#F59E0B"></span>In Progress</div>

  <div class="li"><span class="ld" style="background:#FF6B6B"></span>You</div>
</div>

<div id="zctrl">
  <div class="zb" onclick="zoomMap(1.2)">+</div>
  <div class="zb" onclick="zoomMap(0.83)">−</div>
  <div class="zb" onclick="resetView()" style="font-size:12px;font-weight:700;">⌂</div>
</div>

</div><!-- map-wrap -->

<!-- SIDEBAR PANEL -->
<div id="panel">
  <div id="ph">
    <h3>🗺  Task Map</h3>
    <p>All tasks across Pakistan</p>
  </div>
  <div id="stats">
    <div class="sb"><div class="sn" id="s-open">0</div><div class="sl">Open</div></div>
    <div class="sb"><div class="sn" id="s-total" style="color:var(--text2)">0</div><div class="sl">Total</div></div>
    <div class="sb"><div class="sn" id="s-near" style="color:#4ECDC4;font-size:14px">—</div><div class="sl">Nearest km</div></div>
  </div>
  <div id="filters">
    <button class="fb on" id="fb-all"  onclick="setFilter('ALL')">All</button>
    <button class="fb"    id="fb-open" onclick="setFilter('OPEN')">Open</button>
    <button class="fb"    id="fb-ip"   onclick="setFilter('IN_PROGRESS')">Active</button>
  </div>
  <div id="tlist"></div>
  <button id="vbtn" onclick="doView()">View &amp; Bid on Task →</button>
  <button id="themeBtn" onclick="toggleTheme()">🌙 Dark Mode</button>
</div>

</div><!-- root -->

<script>
// ── Coordinate mapping ─────────────────────────────────────────
var L0=23.5, L1=37.5, G0=60.5, G1=77.5;
var SX=30, SY=30, SW=700, SH=540;

function ll2s(lat,lng){
  return{
    x: SX+(lng-G0)/(G1-G0)*SW,
    y: SY+(1-(lat-L0)/(L1-L0))*SH
  };
}

// ── State ──────────────────────────────────────────────────────
var tasks=[], selId=null, filt='ALL';
var uLat=0, uLng=0;
var vx=0, vy=0, vw=760, vh=600;
var dragging=false, dx0=0, dy0=0, vx0=0, vy0=0;
var isDark=false;
var svg=document.getElementById('map-svg');

// ── Called from Java ───────────────────────────────────────────
function loadTasks(json){
  tasks=JSON.parse(json);
  document.getElementById('s-total').textContent=tasks.length;
  document.getElementById('s-open').textContent=
    tasks.filter(function(t){return t.status==='OPEN';}).length;
  drawPins(); renderList();
}

function setUserLocation(lat,lng,name){
  uLat=lat; uLng=lng;
  var p=ll2s(lat,lng);
  document.getElementById('user').innerHTML=
    '<circle cx="'+p.x+'" cy="'+p.y+'" r="14" fill="#FF6B6B" opacity=".12">'
    +'<animate attributeName="r" values="10;18;10" dur="2s" repeatCount="indefinite"/>'
    +'<animate attributeName="opacity" values=".14;0;.14" dur="2s" repeatCount="indefinite"/>'
    +'</circle>'
    +'<circle cx="'+p.x+'" cy="'+p.y+'" r="6" fill="#FF6B6B" opacity=".2"/>'
    +'<circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="#FF6B6B" stroke="white" stroke-width="2"/>'
    +'<text x="'+(p.x+9)+'" y="'+(p.y+4)+'" font-size="9" fill="#FF6B6B"'
    +' font-weight="800">'+esc(name)+'</text>';
  panTo(p.x,p.y,vw/2,vh/2);
  recalc(); renderList();
}

// ── Draw pins ──────────────────────────────────────────────────
function drawPins(){
  var buf='';
  tasks.forEach(function(t){
    if(!t.lat||!t.lng||(t.lat===0&&t.lng===0)) return;
    var p=ll2s(t.lat,t.lng);
    var col=t.status==='OPEN'?'#22C55E':t.status==='IN_PROGRESS'?'#F59E0B':'#94A3B8';
    var sel=(t.id===selId);
    buf+='<g data-id="'+t.id+'" style="cursor:pointer"'
      +' transform="translate('+p.x+','+p.y+')"'
      +' onmouseenter="showTip(event,'+t.id+')" onmouseleave="hideTip()"'
      +' onclick="selTask('+t.id+')"'+(sel?' filter="url(#glow)"':'')+'>'
      +'<g style="transition:transform .15s"'
      +(sel?' transform="scale(1.35)"':'')+'>'
      +'<path d="M0,-20 C-9,-28 -11,-9 0,4 C11,-9 9,-28 0,-20 Z"'
      +' fill="'+col+'" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>'
      +'<circle cx="0" cy="-15" r="4" fill="rgba(255,255,255,0.9)"/>'
      +'</g></g>';
  });
  document.getElementById('pins').innerHTML=buf;
}

// ── Sidebar list ───────────────────────────────────────────────
function renderList(){
  var list=tasks.filter(function(t){
    return filt==='ALL'||t.status===filt;
  });
  if(uLat!==0){
    list.sort(function(a,b){return(a.distKm||9999)-(b.distKm||9999);});
  } else {
    list.sort(function(a,b){
      if(a.status==='OPEN'&&b.status!=='OPEN') return -1;
      if(a.status!=='OPEN'&&b.status==='OPEN') return 1;
      return 0;
    });
  }
  var html='';
  list.forEach(function(t){
    var dist=t.distKm>0?'<div class="tc-dist">📍 '+t.distKm.toFixed(1)+' km</div>':'';
    var badge=t.status==='OPEN'?'<span class="b-open">Open</span>':
              t.status==='IN_PROGRESS'?'<span class="b-ip">Active</span>':'';
    html+='<div class="tc'+(t.id===selId?' sel':'')+'" onclick="selTask('+t.id+')">'
      +'<div class="tc-cat">'+esc(t.category||'')+'</div>'
      +'<div class="tc-title">'+esc(t.title)+'</div>'
      +'<div class="tc-price">Rs. '+Number(t.budget).toLocaleString()+'</div>'
      +'<div class="tc-meta">📍 '+esc(t.address||'')+'</div>'
      +'<div class="tc-meta">👤 '+esc(t.poster||'')+'</div>'
      +dist+badge+'</div>';
  });
  document.getElementById('tlist').innerHTML=html||
    '<div style="color:var(--text3);padding:20px;text-align:center;font-size:11px">No tasks</div>';
}

function selTask(id){
  selId=id; drawPins(); renderList();
  var t=tasks.find(function(x){return x.id===id;});
  if(t&&t.lat&&t.lng){ var p=ll2s(t.lat,t.lng); panTo(p.x,p.y,vw/2,vh/2); }
  document.getElementById('vbtn').style.display=
    (t&&t.status==='OPEN')?'block':'none';
}
function doView(){if(selId) alert('openTask:'+selId);}

function setFilter(f){
  filt=f;
  ['all','open','ip'].forEach(function(k){
    document.getElementById('fb-'+k).classList.remove('on');
  });
  var m={ALL:'all',OPEN:'open',IN_PROGRESS:'ip'};
  if(m[f]) document.getElementById('fb-'+m[f]).classList.add('on');
  renderList();
}

// ── Tooltip ────────────────────────────────────────────────────
function showTip(e,id){
  var t=tasks.find(function(x){return x.id===id;});
  if(!t) return;
  document.getElementById('t-cat').textContent=t.category||'Other';
  document.getElementById('t-title').textContent=t.title;
  document.getElementById('t-price').textContent='Rs. '+Number(t.budget).toLocaleString();
  document.getElementById('t-addr').textContent=t.address||'';
  var dd=document.getElementById('t-dist');
  if(t.distKm>0){dd.textContent='📍 '+t.distKm.toFixed(1)+' km away';dd.style.display='block';}
  else dd.style.display='none';
  var tip=document.getElementById('tip');
  tip.style.display='block';
  posTip(e);
}
function posTip(e){
  var w=document.getElementById('map-wrap').getBoundingClientRect();
  var tip=document.getElementById('tip');
  var x=e.clientX-w.left+14, y=e.clientY-w.top-10;
  if(x+265>w.width)  x=e.clientX-w.left-275;
  if(y+160>w.height) y=e.clientY-w.top-170;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){document.getElementById('tip').style.display='none';}

// ── Smooth drag + zoom ─────────────────────────────────────────
svg.addEventListener('mousedown',function(e){
  if(e.target.closest&&e.target.closest('[data-id]')) return;
  dragging=true; dx0=e.clientX; dy0=e.clientY; vx0=vx; vy0=vy;
  svg.style.cursor='grabbing';
});
document.addEventListener('mousemove',function(e){
  if(!dragging) return;
  var rect=svg.getBoundingClientRect();
  vx=vx0-(e.clientX-dx0)*vw/rect.width;
  vy=vy0-(e.clientY-dy0)*vh/rect.height;
  clamp(); applyView();
});
document.addEventListener('mouseup',function(){
  dragging=false; svg.style.cursor='grab';
});
svg.style.cursor='grab';

svg.addEventListener('wheel',function(e){
  e.preventDefault();
  var f=e.deltaY<0?1.15:0.87;
  // Zoom toward mouse position
  var rect=svg.getBoundingClientRect();
  var mx=(e.clientX-rect.left)/rect.width*vw+vx;
  var my=(e.clientY-rect.top)/rect.height*vh+vy;
  vw=Math.max(250,Math.min(1100,vw/f));
  vh=vw*600/760;
  vx=mx-((e.clientX-rect.left)/rect.width*vw);
  vy=my-((e.clientY-rect.top)/rect.height*vh);
  clamp(); applyView();
},{passive:false});

function zoomMap(f){
  var cx=vx+vw/2, cy=vy+vh/2;
  vw=Math.max(250,Math.min(1100,vw/f));
  vh=vw*600/760; vx=cx-vw/2; vy=cy-vh/2;
  clamp(); applyView();
}
function panTo(px,py,cx,cy){
  vx=px-cx*(vw/760); vy=py-cy*(vh/600);
  clamp(); applyView();
}
function resetView(){vx=0;vy=0;vw=760;vh=600;applyView();}
function clamp(){
  if(vx<-80) vx=-80; if(vy<-60) vy=-60;
  if(vx+vw>840) vx=840-vw; if(vy+vh>680) vy=680-vh;
}
function applyView(){svg.setAttribute('viewBox',vx+' '+vy+' '+vw+' '+vh);}

// ── Distances ──────────────────────────────────────────────────
function recalc(){
  if(!uLat) return;
  var best=null,bestD=Infinity;
  tasks.forEach(function(t){
    if(!t.lat||!t.lng) return;
    var d=hav(uLat,uLng,t.lat,t.lng);
    t.distKm=d;
    if(t.status==='OPEN'&&d<bestD){bestD=d;best=t;}
  });
  if(best) document.getElementById('s-near').textContent=bestD.toFixed(0);
}
function hav(a,b,c,d){
  var R=6371,dr=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;
  var x=Math.sin(dr/2)*Math.sin(dr/2)
       +Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)
       *Math.sin(dl/2)*Math.sin(dl/2);
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ── Dark/light theme toggle ────────────────────────────────────
function toggleTheme(){
  isDark=!isDark;
  document.body.classList.toggle('dark', isDark);
  document.getElementById('themeBtn').textContent=isDark?'☀️ Light Mode':'🌙 Dark Mode';
  updateMapColors();
}

function updateMapColors(){
  var land=isDark?'#1a1a24':'#E8EFF5';
  var sea =isDark?'#0d0d1a':'#C8DCF0';
  var seaStroke=isDark?'#14142a':'#B5CDE8';
  var border=isDark?'#2a2a42':'#CBD5E1';
  var river=isDark?'#1e2a42':'#93C5FD';
  var riverText=isDark?'#1e2a42':'#93C5FD';
  var cityFill=isDark?'#14141e':'#DBEAFE';
  var cityStroke=isDark?'#1e2a42':'#93C5FD';
  var cityText=isDark?'#3a3a5e':'#64748B';
  var grid=isDark?'#14141c':'#E2E8F0';
  var bgS1=isDark?'#111118':'#EEF4FA';
  var bgS2=isDark?'#0d0d14':'#E4EDF6';
  var seaText=isDark?'#1e2a42':'#93C5FD';

  document.getElementById('bg-stop1').setAttribute('stop-color',bgS1);
  document.getElementById('bg-stop2').setAttribute('stop-color',bgS2);
  document.getElementById('pakistan').setAttribute('fill',land);
  document.getElementById('pakistan').setAttribute('stroke',border);
  document.getElementById('sea').setAttribute('fill',sea);
  document.getElementById('sea').setAttribute('stroke',seaStroke);
  document.querySelectorAll('#provinces path').forEach(function(p){p.setAttribute('stroke',isDark?'#22223a':'#C4D0DE');});
  document.querySelectorAll('#grid-lines line').forEach(function(l){l.setAttribute('stroke',grid);});
  document.querySelectorAll('#cities circle').forEach(function(c){
    c.setAttribute('fill',cityFill); c.setAttribute('stroke',cityStroke);
  });
  document.querySelectorAll('#cities text').forEach(function(t){t.setAttribute('fill',cityText);});
  document.querySelectorAll('#map-svg text[font-style="italic"]').forEach(function(t){t.setAttribute('fill',seaText);});
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function openTask(id){alert('openTask:'+id);}
